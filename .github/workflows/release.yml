name: Build Non-GPL Review Candidate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake ninja-build nasm pkg-config libva-dev libdrm-dev mingw-w64 wine64 ffmpeg python3
      - name: Build and validate
        run: |
          python3 scripts/make_test_fixture.py
          python3 scripts/build_release.py --target linux-x86_64 --target windows-x86_64
          python3 scripts/validate_release.py --target linux-x86_64
          python3 scripts/validate_release.py --target windows-x86_64 --wine /usr/lib/wine/wine64
          python3 scripts/build_release.py --stage-only --target linux-x86_64 --target windows-x86_64
          tar -czf candidate-linux-windows.tar.gz -C .build/targets linux-x86_64/package linux-x86_64/build-manifest.json linux-x86_64/validation windows-x86_64/package windows-x86_64/build-manifest.json windows-x86_64/validation
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-linux-windows
          path: candidate-linux-windows.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and fixture tools
        run: brew install cmake ninja nasm pkg-config ffmpeg
      - name: Enable Intel execution on Apple Silicon
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Build and validate
        run: |
          python3 scripts/make_test_fixture.py
          bash build-ffmpeg-macos.sh
          python3 scripts/validate_release.py --target macos-arm64
          python3 scripts/validate_release.py --target macos-x86_64
          python3 scripts/build_release.py --stage-only --target macos-arm64 --target macos-x86_64
          tar -czf candidate-macos.tar.gz -C .build/targets macos-arm64/package macos-arm64/build-manifest.json macos-arm64/validation macos-x86_64/package macos-x86_64/build-manifest.json macos-x86_64/validation
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-macos
          path: candidate-macos.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v4
      - name: Install build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake ninja-build nasm pkg-config qemu-user ffmpeg python3
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: Build and validate standalone Bionic executables
        run: |
          python3 scripts/make_test_fixture.py
          bash build-ffmpeg-android.sh
          python3 scripts/validate_release.py --target android-arm64-v8a --qemu /usr/bin/qemu-aarch64
          python3 scripts/validate_release.py --target android-armeabi-v7a --qemu /usr/bin/qemu-arm
          python3 scripts/build_release.py --stage-only --target android-arm64-v8a --target android-armeabi-v7a
          tar -czf candidate-android.tar.gz -C .build/targets android-arm64-v8a/package android-arm64-v8a/build-manifest.json android-arm64-v8a/validation android-armeabi-v7a/package android-armeabi-v7a/build-manifest.json android-armeabi-v7a/validation
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-android
          path: candidate-android.tar.gz
          if-no-files-found: error

  assemble-for-review:
    needs: [linux-windows, macos, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          merge-multiple: true
          path: candidates
      - name: Assemble verified local archives
        run: |
          mkdir -p .build/targets
          for archive in candidates/*.tar.gz; do
            tar -xzf "$archive" -C .build/targets
          done
          python3 scripts/build_release.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: non-gpl-release-for-review
          path: dist/non-gpl-candidate
          if-no-files-found: error

# Deliberately no GitHub Release creation, tag creation, or publish step.
